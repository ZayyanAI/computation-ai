# Render Blueprint — Backend CountMeasure AI (long-running FastAPI server).
#
# Backend DIPISAH dari Vercel karena dependency berat (torch / opencv-python /
# ultralytics) terlampau besar (>50MB) dan inference model tidak muat dalam
# batas waktu serverless Vercel. Frontend tetap di-deploy ke Vercel dan
# memanggil service ini via environment variable VITE_API_BASE_URL.
#
# Cara deploy:
#   1. Push repo ini ke GitHub (pastikan backend/*.pt ikut ter-commit).
#   2. Dashboard Render -> New -> Blueprint -> pilih repo -> Import.
#   3. Render membuat service web bernama countmeasure-backend
#      (URL: https://countmeasure-backend.onrender.com).
#   4. Pastikan env VITE_API_BASE_URL di project Vercel menunjuk ke URL di atas.
services:
  - type: web
    name: countmeasure-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"